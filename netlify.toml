[build.environment]
  NODE_VERSION = "24"

# Rate limit the contact form endpoint — each submission sends SES email.
# Pass-through rule: requests are served normally until the limit is hit,
# then Netlify answers with HTTP 429 at the edge.
[[redirects]]
  from = "/api/contact"
  to = "/api/contact"
  # 200 = rewrite (pass-through). Without it Netlify defaults to a 301 back to
  # the same URL, which loops and burns the rate limit -> 429 on every submit.
  status = 200
  force = true

  [redirects.rate_limit]
    # 5 requests per IP per minute
    window_limit = 5
    window_size = 60
    aggregate_by = ["ip", "domain"]
